name: ansible-validate

on:
  push:
    branches: ["main","exam-ansible-project"]
  pull_request:
    branches: ["main","exam-ansible-project"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible + ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run ansible-lint
        run: |
          ansible-lint .

      - name: Playbook syntax check
        run: |
          ansible-playbook -i localhost, -c local playbook.yaml --syntax-check
